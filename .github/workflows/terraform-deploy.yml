name: Terraform infrastuctre Apply

on:
  push:
    branches: ["{DEFAULT_BRANCH}"]   # e.g. "main"
    paths:
      - "terraform/**.tf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Requires backend.tf (renamed from backend.tf.example and filled in)
      # to already be committed - see README step 2. This is what reads the
      # existing state from terraform/terraform.tfstate in the bucket.
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}

      # Applying on every push to the default branch. State gets written
      # straight back to s3://<bucket>/terraform/terraform.tfstate as part
      # of apply - no separate "save state" step needed, that's what the
      # S3 backend does.
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
